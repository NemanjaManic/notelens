[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notelens-extraction"
version = "0.1.0"
description = "Provisional NoteLens extraction and document-answer service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "notelens-contracts"]

[tool.uv.sources]
notelens-contracts = { path = "../../contracts/generated/python" }

[project.scripts]
notelens-extraction = "notelens_extraction.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/notelens_extraction"]

[project]
name = "notelens-rag"
version = "0.1.0"
description = "NoteLens owner-local RAG mock scaffold"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jsonschema[format]>=4.23,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notelens_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
